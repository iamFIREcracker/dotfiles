unbind C-b
# set -g prefix ¶ # I got my Tab key to generate this
# bind ¶ send-prefix
set -g prefix M-w
bind M-w send-prefix

# Numeric prefixes a la vim
bind 1 switch-client -Ttable1

# Numeric prefixes a la vim
bind C-x switch-client -Ttablecx

# Relax!
set -sg escape-time 10
set -sg repeat-time 600

# Focus
set -g focus-events on

# Mouse
set -g mouse on

# Force emacs status-keys to fix C-b/C-f navigation in command mode (:)
# preventing tmux from auto-defaulting to 'vi' mode based on $EDITOR.
set -g status-keys emacs

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Update the terminal title
set-window-option -g automatic-rename off
set-option -g set-titles on
set-option -g set-titles-string "[#S] [#h]"

# Reload the config.
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Saner splitting.
bind v split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'

bind C-n new

# Pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Layouts
set -g main-pane-width 260

# Pane resizing
bind -r < resize-pane -L 5
bind -r > resize-pane -R 5
bind -r _ resize-pane -D 5
bind -r m resize-pane -Z

# Window movement
# Only really makes sense if you have your parens bound to shifts like me.
bind -r ( select-window -t :-
bind -r ) select-window -t :+

set -g default-terminal "$TERM"
# true colors
set -ga terminal-overrides ",$TERM*:Tc"
# undercurl
set -ga terminal-features ",alacritty:usstyle"
# Extended keys: makes Ctrl-digit a distinct, bindable key (used by the
# C-digit pane color bindings below)
set -s extended-keys on
set -ga terminal-features ",alacritty:extkeys"
# Allow OSC52 to pass through to the terminal (for `cb` clipboard over SSH)
set -g allow-passthrough on



# Re-set SSH_CONNECTION
# Re-evaluate the following env variables, when re-attaching
# This makes sure `cb` keeps on working, across different SSH sessions
set -g update-environment "TERM SSH_CONNECTION SSH_CLIENT SSH_TTY WSL_DISTRO_NAME WSL_INTEROP WSL_GUEST_IP WSLENV WSL_HOST_IP LC_BR_REMOTE_PORT LC_CB_REMOTE_PORT LC_MG_REMOTE_PORT"

set -g pane-border-style fg=colour8
set -g pane-active-border-style fg=colour8

set -g window-style none
set -g window-active-style none
# Flash the current pane with ^A (bell)
bind C-a run-shell "tmux set -w window-active-style bg=colour13; sleep .016; tmux set -w window-active-style none; sleep .016; tmux set -w window-active-style bg=colour13; sleep .016; tmux set -w window-active-style none;"

set -g message-style fg=default,bg=default
set -g message-command-style fg=default,bg=default

# set -g status-position bottom
set -g status-position top
set -g status-interval 5
set -g status-style none
set -g status-left-length 0
set -g status-left ""

# Remove gap between windows in the status line
set-window-option -g window-status-separator ''
set -g window-status-style none
set -g window-status-bell-style none
set -g window-status-format "#[#{?window_bell_flag,bg=color9 fg=color15,bg=default fg=color8}] #W#{?window_bell_flag, !,}#{?window_zoomed_flag, [M],} #[fg=default,bg=default]"
set -g window-status-current-style bold
set -g window-status-current-format "#[bg=default,fg=color8,reverse] #W#{?window_bell_flag, !,}#{?window_zoomed_flag, [M],} #[bg=default,bg=default,default]"

set -g status-right-length 150
set -g status-right "#[bg=default,fg=color8] #(date +'%%e - %%I:%%M %%p') #[fg=default,bg=default,default]"

set -g mode-style "bg=default,fg=color6,reverse,bold"

# Search
set -g copy-mode-match-style "bg=color11,fg=black"
set -g copy-mode-current-match-style "bg=color10,fg=black"


# Alerts and monitoring
set -g monitor-bell on
set -g monitor-activity off
set -g monitor-silence 0

set -g visual-activity off

# Autorename sanely.
setw -g automatic-rename on

# Copy mode
setw -g mode-keys vi
bind N copy-mode
unbind [

bind -T copy-mode-vi v       send -X begin-selection
bind -T copy-mode-vi y       send -X copy-pipe-and-cancel "cb"
bind -T copy-mode-vi Escape  send -X cancel
bind -T copy-mode-vi H       send -X start-of-line
bind -T copy-mode-vi L       send -X end-of-line
bind -T copy-mode-vi C-v     send -X halfpage-down
bind -T copy-mode-vi M-v     send -X halfpage-up

# [[ to go to the previous prompt
bind -T copy-mode-vi     [   switch-client -T copy-mode-vi-osb
bind -T copy-mode-vi-osb [   send -X previous-prompt \; switch-client -T copy-mode-vi

# ]] to go to the next prompt
bind -T copy-mode-vi     ]   switch-client -T copy-mode-vi-csb
bind -T copy-mode-vi-csb ]   send -X next-prompt \; switch-client -T copy-mode-vi

# Colored panes (C-digit, needs extended-keys; plain digits stay free for the
# vim-like numeric prefix tables, M-digit jumps to ta session marks)
bind C-0 select-pane -P "default"
bind C-1 select-pane -P "bg=color1,fg=color15"
bind C-2 select-pane -P "bg=color2,fg=color15"
bind C-3 select-pane -P "bg=color11,fg=color0"
bind C-4 select-pane -P "bg=color4,fg=color15"
bind C-5 select-pane -P "bg=color5,fg=color15"
bind C-6 select-pane -P "bg=color6,fg=color15"
bind C-7 select-pane -P "bg=color15,fg=color0"
bind C-8 select-pane -P "bg=color0,fg=color15"

bind ` new-window -b sh -c "edit-pasteboard"

bind - switch-client -l
bind p select-pane -l

# Use `ta` to switch sessions
bind C-p popup -E -E "ta -- --height 100%"
bind -T table1 C-p popup -E -E "NOCACHE=1 ta -- --height 100%"
set-hook -g client-session-changed 'run-shell -b "~/bin/ta __sync #{hook_client}"'
# Session marks: prefix M-N jumps to the session marked in slot N (`ta mark`).
# With the M-w prefix the whole gesture is one Alt chord: hold Alt, w, digit.
bind M-1 run-shell "TA_CLIENT='#{client_name}' ~/bin/ta go 1"
bind M-2 run-shell "TA_CLIENT='#{client_name}' ~/bin/ta go 2"
bind M-3 run-shell "TA_CLIENT='#{client_name}' ~/bin/ta go 3"
bind M-4 run-shell "TA_CLIENT='#{client_name}' ~/bin/ta go 4"
bind @ new-window -b "sh -c 'cal -3; dates; press-enter-to-exit'"
# The following can be used to quickly run a command / application
# in a split pane
bind ! command-prompt -p "Shell command:" "new-window -b -c '#{pane_current_path}' sh -c '%%; press-enter-to-exit'"
bind W command-prompt -p "w3m search:" "run-shell \"w3mw-tmux '%%'\""
bind y capture-pane -J \; save-buffer "$TMP/tmux-buffer" \; delete-buffer \; new-window -b sh -c "cat $TMP/tmux-buffer | vim -R + -"
bind Y capture-pane -J -S - \; save-buffer "$TMP/tmux-buffer" \; delete-buffer \; new-window -b sh -c "cat $TMP/tmux-buffer | vim -R + -"

# Send the current pane to a new window (similar to Vim's <c-w>T)
bind T break-pane -t :
# Kill the current pane (similar to Vim's <c-w>q)
bind q kill-pane
# Move panes around (similar to Vim's) https://superuser.com/a/1601793
bind H splitw -fhb \; swapp -t ! \; killp -t !
bind L splitw -fh  \; swapp -t ! \; killp -t !
bind J splitw -fv  \; swapp -t ! \; killp -t !
bind K splitw -fvb \; swapp -t ! \; killp -t !


# C-x C-e to edit clipboard
bind -T tablecx C-e new-window -b sh -c "edit-pasteboard"

# C-g to copy the current pane ID to the clipboard
# handy when working with tbone.vim
bind C-g run-shell tmux-pane-to-cb

# tmux-externalpipe
set -g @externalpipe-cg-cmd      'cg-fzf'
set -g @externalpipe-cg-key      'Enter'
run-shell ~/.tmux-plugins/tmux-externalpipe/externalpipe.tmux
