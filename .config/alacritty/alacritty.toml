[general]
live_config_reload = true
import = [
  "./theme.toml",
  "./local-override.toml",
]


# On Windows run:
# setx WSLENV "TERM/u:CB_OSC52/u:LC_TERMINAL_TYPE/u:COLORTERM/u:LC_TA_GROUP/u"
[env]
TERM = "alacritty"
CB_OSC52 = "1"
LC_TERMINAL_TYPE = "TERMINAL"
COLORTERM = "truecolor"

[window]
title = "TERMINAL"
dynamic_title = true

  [window.dimensions]
  columns = 80
  lines = 24

  [window.padding]
  x = 4
  y = 4

[scrolling]
history = 0 # Disable scroll history (use Tmux's)

[selection]
save_to_clipboard = true

[bell]
duration = 0 # Disable visual bell

[cursor]
thickness = 0.3

  [cursor.style]
  shape = "Beam"
  blinking = "Never"

[hints]
enabled = [ ]

# Shift/Control/Control+Shift-Return are sent as CSI u (kitty keyboard
# protocol) sequences, which is what Claude Code, opencode and pi understand
# natively, inside and outside of tmux (where `extended-keys on` forwards them
# untouched to panes that asked for modified keys).  The previous ESC+LF /
# ESC+CR encodings were rewritten by tmux into Ctrl+Alt+j / Alt+Enter once
# extended-keys got enabled, and opencode/pi never understood them anyway.
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b[13;2u"

[[keyboard.bindings]]
key = "Return"
mods = "Control"
chars = "\u001b[13;5u"

[[keyboard.bindings]]
key = "Return"
mods = "Control|Shift"
chars = "\u001b[13;6u"

# Without these, at least on Windows, pressing End inside/outside of tmux would yield different raw codes:
# - Outside: ^[[F
# - Inside: ^[[4~
[[keyboard.bindings]]
key = "End"
chars = "\u001b[4~"
[[keyboard.bindings]]
key = "Home"
chars = "\u001b[1~"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "CreateNewWindow"
